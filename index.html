<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Color Vision Challenge - เกมทดสอบสายตา</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        /* นำเข้าฟอนต์ SaoChingcha-Bold */
        @font-face {
            font-family: 'SaoChingcha';
            src: url('https://raw.githubusercontent.com/usamanyakoh/Project-Work/main/SaoChingcha-Bold.otf') format('opentype');
            font-weight: normal;
            font-style: normal;
        }

        body {
            font-family: 'SaoChingcha', sans-serif;
            background-color: #0f172a; /* พื้นหลังสีกรมท่าเข้ม */
            color: #f8fafc;
            overflow: hidden; /* ป้องกันการเลื่อนหน้าจอ (Scroll) บนมือถือ */
            touch-action: manipulation; /* ป้องกันการซูมด้วยนิ้ว */
            -webkit-user-select: none; /* ป้องกันการคลุมดำข้อความ */
            user-select: none;
        }

        .glass-panel {
            background-color: #1e253c; /* สีพื้นหลังกล่องตามต้นฉบับ */
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .color-btn {
            transition: transform 0.1s;
        }
        .color-btn:active {
            transform: scale(0.92);
        }
        .fade-in {
            animation: fadeIn 0.3s ease-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.98); }
            to { opacity: 1; transform: scale(1); }
        }
        @keyframes popUp {
            0% { transform: scale(0.5); opacity: 0; }
            50% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            50% { transform: translateX(5px); }
            75% { transform: translateX(-5px); }
        }
        .animate-popup { animation: popUp 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        .animate-shake { animation: shake 0.3s ease-in-out forwards; }
    </style>
</head>
<body class="w-screen h-[100dvh] flex flex-col items-center justify-center p-3 sm:p-4 bg-[#0d1326]">

    <!-- Main Game Container (Fixed Full Height) -->
    <div class="w-full h-full max-w-md glass-panel rounded-3xl relative flex flex-col overflow-hidden">
        
        <!-- ================= START SCREEN ================= -->
        <div id="start-screen" class="flex flex-col h-full fade-in">
            <!-- Header (อยู่ในกรอบ) -->
            <div class="bg-[#151a2d] py-5 px-4 w-full border-b border-white/5 text-center shadow-lg">
                <h1 class="text-3xl sm:text-4xl text-[#38bdf8] mb-1" style="text-shadow: 0 0 10px rgba(56,189,248,0.3);">
                    COLOR VISION CHALLENGE
                </h1>
                <p class="text-sm sm:text-base text-gray-400">แบบทดสอบสายตา: แยกแยะความผิดปกติของเม็ดสี</p>
            </div>

            <!-- Content -->
            <div class="flex-1 flex flex-col justify-center items-center p-5 space-y-6">
                <!-- Glowing Eye Icon -->
                <div class="relative flex justify-center items-center">
                    <div class="w-20 h-20 bg-gradient-to-tr from-[#38bdf8] to-[#3b82f6] rounded-full flex items-center justify-center shadow-[0_0_40px_rgba(56,189,248,0.6)]">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                        </svg>
                    </div>
                </div>

                <!-- Text Instruction -->
                <div class="text-center">
                    <p class="text-white text-lg sm:text-xl">ระบบจะสุ่มเฉดสี 10 ข้อ (คละความยาก)</p>
                    <p class="text-red-400 text-lg sm:text-xl mt-1">⚠️ คุณมีเวลาจำกัดข้อละ 5 วินาที!</p>
                </div>

                <!-- Input Fields -->
                <div class="w-full space-y-3 px-4">
                    <input type="text" id="fname" placeholder="ชื่อจริง..." class="w-full px-5 py-3 rounded-full bg-[#171d2d] border border-slate-700 text-white placeholder-gray-500 focus:outline-none focus:border-[#38bdf8] text-center text-lg transition-colors">
                    <input type="text" id="lname" placeholder="นามสกุล..." class="w-full px-5 py-3 rounded-full bg-[#171d2d] border border-slate-700 text-white placeholder-gray-500 focus:outline-none focus:border-[#38bdf8] text-center text-lg transition-colors">
                    <p id="name-error" class="text-red-400 text-sm text-center hidden">กรุณากรอกชื่อและนามสกุลให้ครบ!</p>
                </div>

                <!-- Start Button -->
                <div class="w-full px-4 pt-2">
                    <button onclick="startGame()" class="w-full bg-gradient-to-r from-[#4f46e5] to-[#3b82f6] text-white py-3.5 rounded-full text-xl sm:text-2xl shadow-[0_0_20px_rgba(79,70,229,0.5)] active:scale-95 transition-transform">
                        เริ่มทดสอบสายตา
                    </button>
                </div>
            </div>
        </div>

        <!-- ================= GAME SCREEN ================= -->
        <div id="game-screen" class="hidden flex-col h-full p-4 sm:p-5 fade-in">
            
            <!-- Top Status Bar -->
            <div class="flex justify-between items-center w-full mb-6 mt-2">
                <!-- Question Number (Pill) -->
                <div class="bg-[#1e293b] text-[#38bdf8] px-4 py-1.5 rounded-full text-base sm:text-lg border border-slate-700/50 shadow-sm whitespace-nowrap">
                    ข้อที่ <span id="level-display">1</span>/10
                </div>

                <!-- Timer -->
                <div class="flex flex-col items-center justify-center mx-2 flex-1 max-w-[80px]">
                    <span id="timer-text" class="text-2xl sm:text-3xl text-white leading-none mb-1">5</span>
                    <div class="w-full h-1 bg-[#1e293b] rounded-full overflow-hidden">
                        <div id="timer-bar" class="h-full bg-emerald-400 w-full" style="transition: width 1s linear;"></div>
                    </div>
                </div>

                <!-- Difficulty (Pill) -->
                <div id="difficulty-pill" class="bg-[#332a15] text-[#fbbf24] px-4 py-1.5 rounded-full text-base sm:text-lg border border-yellow-900/30 shadow-sm whitespace-nowrap">
                    ระดับ: <span id="difficulty-display">ง่าย</span>
                </div>
            </div>

            <!-- Central Display Area -->
            <div class="flex-1 flex flex-col items-center justify-center mb-2">
                <p class="text-gray-400 text-xl sm:text-2xl tracking-wide uppercase mb-4" id="color-name">COLOR NAME</p>
                <!-- Target Color Circle -->
                <div id="target-color" class="w-32 h-32 sm:w-40 sm:h-40 rounded-full border-4 border-[#2c3656] shadow-xl transition-colors duration-200"></div>
            </div>

            <!-- Options (2x2 Grid) -->
            <div class="w-full pb-4">
                <p class="text-center text-gray-400 mb-3 text-lg sm:text-xl">เลือกสีที่ตรงกับเป้าหมายที่สุด</p>
                <div class="grid grid-cols-2 gap-3 sm:gap-4 w-full h-[35vh] max-h-[300px]" id="options-container">
                    <!-- Buttons generated dynamically -->
                </div>
            </div>
        </div>

        <!-- ================= POPUP OVERLAY ================= -->
        <div id="feedback-popup" class="hidden absolute inset-0 z-50 flex items-center justify-center bg-[#0d1326]/80 backdrop-blur-sm">
            <div id="feedback-content" class="bg-[#1e253c] border-2 rounded-2xl p-6 text-center w-3/4 max-w-xs shadow-2xl">
                <div id="feedback-icon" class="text-5xl mb-2">🎉</div>
                <h3 id="feedback-title" class="text-3xl font-bold mb-1"></h3>
            </div>
        </div>

        <!-- ================= END SCREEN ================= -->
        <div id="end-screen" class="hidden flex-col h-full fade-in p-4 overflow-y-auto">
            <!-- Result Card -->
            <div id="capture-card" class="bg-[#151a2d] rounded-2xl shadow-2xl border border-white/5 p-5 relative overflow-hidden flex-1 flex flex-col justify-center min-h-min mb-4">
                
                <h2 class="text-3xl sm:text-4xl text-center text-white mb-1">สรุปผลการทดสอบ</h2>
                <h3 class="text-xl sm:text-2xl text-center text-[#38bdf8] mb-4">คุณ <span id="display-player-name"></span></h3>
                
                <!-- Score -->
                <div class="text-center mb-4">
                    <div class="text-7xl sm:text-8xl text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 to-[#38bdf8] leading-none mb-2">
                        <span id="final-score">0</span><span class="text-4xl text-gray-500">/10</span>
                    </div>
                </div>

                <!-- Advice Block -->
                <div class="bg-[#0f172a] rounded-xl p-4 border border-slate-700/50 text-left w-full space-y-3">
                    <div>
                        <p class="text-lg text-[#38bdf8] mb-1">💡 คำแนะนำ:</p>
                        <p id="health-advice" class="text-base sm:text-lg text-gray-300 leading-snug"></p>
                    </div>
                    <div class="border-t border-slate-700 pt-3">
                        <p class="text-lg text-pink-400 mb-1">🎁 รางวัลของคุณ:</p>
                        <p id="prize-display" class="text-xl sm:text-2xl text-white"></p>
                    </div>
                </div>
            </div>

            <!-- Save Button -->
            <div class="w-full pb-2">
                <button onclick="saveToGallery()" class="w-full bg-gradient-to-r from-emerald-500 to-teal-500 text-white py-3.5 rounded-full text-xl sm:text-2xl shadow-[0_0_15px_rgba(16,185,129,0.4)] active:scale-95 transition-transform flex justify-center items-center gap-2">
                    📸 บันทึกหน้าจอ
                </button>
            </div>
        </div>

    </div>

    <script>
        // Data structure matching 2x2 grid (4 options)
        const gameData = [
            // EASY (สีห่างกันมาก)
            { name: "แดง (Red)", target: "#E53935", options: ["#E53935", "#FF8A80", "#880E4F", "#FF5252"], level: "Easy" },
            { name: "น้ำเงิน (Blue)", target: "#1E88E5", options: ["#1E88E5", "#82B1FF", "#0D47A1", "#448AFF"], level: "Easy" },
            { name: "เขียว (Green)", target: "#43A047", options: ["#43A047", "#B9F6CA", "#1B5E20", "#69F0AE"], level: "Easy" },
            { name: "เหลือง (Yellow)", target: "#FDD835", options: ["#FDD835", "#FFF59D", "#F57F17", "#FFFF00"], level: "Easy" },
            { name: "ม่วง (Purple)", target: "#8E24AA", options: ["#8E24AA", "#E1BEE7", "#4A148C", "#E040FB"], level: "Easy" },
            
            // MEDIUM (สีใกล้เคียงกัน)
            { name: "กากี (Khaki)", target: "#D4E157", options: ["#D4E157", "#CDDC39", "#C0CA33", "#E6EE9C"], level: "Medium" },
            { name: "แซลมอน (Salmon)", target: "#FF8A65", options: ["#FF8A65", "#FF7043", "#FFAB91", "#F4511E"], level: "Medium" },
            { name: "เทอร์ควอยซ์ (Turquoise)", target: "#00BCD4", options: ["#00BCD4", "#26C6DA", "#00ACC1", "#4DD0E1"], level: "Medium" },
            { name: "บานเย็น (Magenta)", target: "#E040FB", options: ["#E040FB", "#D500F9", "#EA80FC", "#AA00FF"], level: "Medium" },
            { name: "ทอง (Gold)", target: "#FFCA28", options: ["#FFCA28", "#FFB300", "#FFD54F", "#FFC107"], level: "Medium" },
            { name: "เงิน (Silver)", target: "#B0BEC5", options: ["#B0BEC5", "#90A4AE", "#CFD8DC", "#78909C"], level: "Medium" },
            { name: "ช็อกโกแลต (Chocolate)", target: "#6D4C41", options: ["#6D4C41", "#5D4037", "#795548", "#8D6E63"], level: "Medium" },
            { name: "หินชนวน (Slate)", target: "#78909C", options: ["#78909C", "#607D8B", "#90A4AE", "#546E7A"], level: "Medium" },

            // HARD (สีแทบจะเหมือนกัน)
            { name: "แดงสด (Crimson)", target: "#DC143C", options: ["#DC143C", "#D11438", "#E61440", "#C81235"], level: "Hard" },
            { name: "น้ำเงินเข้ม (Dark Blue)", target: "#00008B", options: ["#00008B", "#000095", "#000080", "#00009F"], level: "Hard" },
            { name: "เขียวป่า (Forest Green)", target: "#228B22", options: ["#228B22", "#208220", "#249424", "#1E7D1E"], level: "Hard" },
            { name: "เหลืองเลมอน (Lemon)", target: "#FFFACD", options: ["#FFFACD", "#FFFBD6", "#FFF8C2", "#FFFCE0"], level: "Hard" },
            { name: "ม่วงออร์คิด (Orchid)", target: "#DA70D6", options: ["#DA70D6", "#D666D2", "#DF7ADC", "#D15CD0"], level: "Hard" },
            { name: "ส้มอิฐ (Brick)", target: "#B22222", options: ["#B22222", "#AD2020", "#B82424", "#A81E1E"], level: "Hard" },
            { name: "ชมพูบานเย็น (Deep Pink)", target: "#FF1493", options: ["#FF1493", "#F5128C", "#FF1998", "#EB1085"], level: "Hard" },
            { name: "ฟ้าพาสเทล (Pastel Blue)", target: "#AEC6CF", options: ["#AEC6CF", "#A8BFC8", "#B5CDD6", "#A2B8C2"], level: "Hard" }
        ];

        let currentLevel = 0;
        let score = 0;
        let isWaitingForNext = false;
        let currentQuestions = [];
        let playerName = "";
        
        let timerInterval;
        let timeLeft = 0;

        // UI Elements
        const startScreen = document.getElementById('start-screen');
        const gameScreen = document.getElementById('game-screen');
        const endScreen = document.getElementById('end-screen');
        const optionsContainer = document.getElementById('options-container');
        const targetColorDisplay = document.getElementById('target-color');
        const colorNameDisplay = document.getElementById('color-name');
        const levelDisplay = document.getElementById('level-display');
        const difficultyPill = document.getElementById('difficulty-pill');
        const difficultyDisplay = document.getElementById('difficulty-display');
        
        const feedbackPopup = document.getElementById('feedback-popup');
        const feedbackContent = document.getElementById('feedback-content');
        const feedbackIcon = document.getElementById('feedback-icon');
        const feedbackTitle = document.getElementById('feedback-title');
        
        const timerBar = document.getElementById('timer-bar');
        const timerText = document.getElementById('timer-text');

        function shuffleArray(array) {
            let arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function startGame() {
            const fname = document.getElementById('fname').value.trim();
            const lname = document.getElementById('lname').value.trim();
            const nameError = document.getElementById('name-error');
            
            if (!fname || !lname) {
                nameError.classList.remove('hidden');
                return;
            }
            nameError.classList.add('hidden');
            playerName = `${fname} ${lname}`;
            
            currentLevel = 0;
            score = 0;
            isWaitingForNext = false;
            
            // สุ่ม 10 ข้อ: ง่าย 2, กลาง 4, ยาก 4
            const easyQs = shuffleArray(gameData.filter(q => q.level === 'Easy')).slice(0, 2);
            const medQs = shuffleArray(gameData.filter(q => q.level === 'Medium')).slice(0, 4);
            const hardQs = shuffleArray(gameData.filter(q => q.level === 'Hard')).slice(0, 4);
            
            // นำมารวมและสุ่มลำดับอีกครั้ง
            currentQuestions = shuffleArray([...easyQs, ...medQs, ...hardQs]);
            
            startScreen.classList.add('hidden');
            startScreen.classList.remove('flex');
            gameScreen.classList.remove('hidden');
            gameScreen.classList.add('flex');
            
            loadLevel();
        }

        function startTimer() {
            const limit = 5; // ล็อคเวลา 5 วินาที
            clearInterval(timerInterval);
            timeLeft = limit;
            
            timerText.innerText = timeLeft;
            timerText.style.color = "white";
            
            timerBar.style.transition = 'none';
            timerBar.style.width = '100%';
            timerBar.className = 'h-full bg-emerald-400 w-full';
            
            setTimeout(() => {
                timerBar.style.transition = 'width 1s linear';
                timerBar.style.width = ((timeLeft - 1) / limit * 100) + '%';
            }, 50);

            timerInterval = setInterval(() => {
                timeLeft--;
                timerText.innerText = timeLeft;
                
                if (timeLeft > 0) {
                    timerBar.style.width = ((timeLeft - 1) / limit * 100) + '%';
                } else {
                    timerBar.style.width = '0%';
                }
                
                if (timeLeft <= 2) {
                    timerBar.classList.remove('bg-emerald-400');
                    timerBar.classList.add('bg-red-500');
                    timerText.style.color = "#f87171"; // red-400
                }
                
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    handleAnswer(false, true); // ผิดแบบหมดเวลา
                }
            }, 1000);
        }

        function loadLevel() {
            isWaitingForNext = false;
            const currentData = currentQuestions[currentLevel];
            
            levelDisplay.innerText = currentLevel + 1;
            colorNameDisplay.innerText = currentData.name;
            targetColorDisplay.style.backgroundColor = currentData.target;
            
            // Set Difficulty Style
            if(currentData.level === 'Easy') {
                difficultyDisplay.innerText = "ง่าย";
                difficultyPill.className = "bg-[#143322] text-[#4ade80] px-4 py-1.5 rounded-full text-base sm:text-lg border border-green-900/50 shadow-sm whitespace-nowrap";
            } else if (currentData.level === 'Medium') {
                difficultyDisplay.innerText = "ปานกลาง";
                difficultyPill.className = "bg-[#332a15] text-[#fbbf24] px-4 py-1.5 rounded-full text-base sm:text-lg border border-yellow-900/50 shadow-sm whitespace-nowrap";
            } else {
                difficultyDisplay.innerText = "ยาก";
                difficultyPill.className = "bg-[#381515] text-[#f87171] px-4 py-1.5 rounded-full text-base sm:text-lg border border-red-900/50 shadow-sm whitespace-nowrap";
            }
            
            optionsContainer.innerHTML = '';
            const shuffledOptions = shuffleArray([...currentData.options]);
            
            shuffledOptions.forEach((colorCode) => {
                const btn = document.createElement('button');
                // ใช้สีปุ่มไม่มีขอบหรือมีขอบจางๆ เพื่อความมินิมอลตามแบบ
                btn.className = `color-btn w-full h-full rounded-2xl cursor-pointer shadow-md`;
                btn.style.backgroundColor = colorCode;
                
                // Touch events for instant response on mobile
                const triggerAnswer = (e) => {
                    e.preventDefault();
                    if (isWaitingForNext) return;
                    handleAnswer(colorCode === currentData.target, false);
                };
                
                btn.addEventListener('touchstart', triggerAnswer, {passive: false});
                btn.addEventListener('mousedown', triggerAnswer);
                
                optionsContainer.appendChild(btn);
            });

            startTimer();
        }

        function handleAnswer(isCorrect, isTimeout) {
            clearInterval(timerInterval); 
            isWaitingForNext = true;
            
            feedbackContent.classList.remove('border-emerald-500', 'border-red-500', 'animate-popup', 'animate-shake');
            
            if (isCorrect) {
                score++;
                feedbackIcon.innerText = "✅";
                feedbackTitle.innerText = "ถูกต้อง!";
                feedbackTitle.className = "text-3xl sm:text-4xl text-emerald-400";
                feedbackContent.classList.add('border-emerald-500', 'animate-popup');
            } else {
                feedbackIcon.innerText = "❌";
                feedbackTitle.innerText = "ผิด!";
                feedbackTitle.className = "text-3xl sm:text-4xl text-red-500";
                feedbackContent.classList.add('border-red-500', 'animate-shake');
            }

            feedbackPopup.classList.remove('hidden');

            setTimeout(() => {
                feedbackPopup.classList.add('hidden');
                currentLevel++;
                
                if (currentLevel < 10) {
                    loadLevel();
                } else {
                    showEndScreen();
                }
            }, 600); // ดีเลย์แสดงผลแปปนึงแล้วเปลี่ยนข้อ
        }

        function showEndScreen() {
            gameScreen.classList.add('hidden');
            gameScreen.classList.remove('flex');
            endScreen.classList.remove('hidden');
            endScreen.classList.add('flex');
            
            document.getElementById('final-score').innerText = score;
            document.getElementById('display-player-name').innerText = playerName;

            const adviceDisplay = document.getElementById('health-advice');
            const prizeDisplay = document.getElementById('prize-display');
            
            // Logic คำแนะนำและของรางวัล
            if (score >= 9) {
                adviceDisplay.innerText = "สายตาดีเยี่ยม! เซลล์รับสีของคุณทำงานประสานกันได้สมบูรณ์แบบมาก พยายามรักษาสุขภาพตาแบบนี้ต่อไปครับ";
                prizeDisplay.innerText = "🥚 ไข่ไก่ต้ม 1 ฟอง + 🥢 ไม้เกาหลัง";
            } else if (score >= 5) {
                adviceDisplay.innerText = "สายตาอยู่ในเกณฑ์ปกติ แต่อาจมีภาวะตาล้าจากการจ้องจอนานๆ ควรพักสายตาตามกฎ 20-20-20 นะครับ";
                prizeDisplay.innerText = "🥚 ไข่ไก่ต้ม 1 ฟอง";
            } else if (score >= 3) {
                adviceDisplay.innerText = "ตาเริ่มล้าสะสม หรือมีความเสี่ยงเล็กน้อย ควรพักสายตา มองที่กว้างๆ หรือต้นไม้สีเขียวบ้างครับ";
                prizeDisplay.innerText = "🥚 ไข่นกกระทาต้ม 1 ฟอง";
            } else {
                adviceDisplay.innerText = "มีความเสี่ยงความผิดปกติในการแยกแยะสี หรือตาล้าหนักมาก แนะนำให้หลีกเลี่ยงการใช้แสงจ้า และควรปรึกษาจักษุแพทย์เพื่อตรวจเพิ่มเติมครับ";
                prizeDisplay.innerText = "🥚 ไข่นกกระทาต้ม 1 ฟอง";
            }
        }

        async function saveToGallery() {
            const captureArea = document.getElementById('capture-card');
            
            // เปลี่ยนสีพื้นหลังชั่วคราวตอนถ่ายรูปเพื่อให้ไม่มีขอบโปร่งใส
            const originalBg = captureArea.style.backgroundColor;
            captureArea.style.backgroundColor = "#151a2d";
            
            try {
                const canvas = await html2canvas(captureArea, {
                    scale: 2, 
                    backgroundColor: "#0d1326", 
                    logging: false,
                    useCORS: true
                });
                
                const image = canvas.toDataURL("image/png");
                const link = document.createElement('a');
                link.href = image;
                link.download = `ColorVision_${playerName.replace(/\s/g, '_')}.png`;
                link.click();
            } catch (err) {
                console.error("Capture Failed:", err);
            } finally {
                captureArea.style.backgroundColor = originalBg;
            }
        }
    </script>
</body>
</html>
